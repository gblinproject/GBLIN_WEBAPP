<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening X…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#e7e7e7}
  a.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:#fff;color:#000;
        text-decoration:none;font-weight:600}
  p{opacity:.8;padding:0 24px;text-align:center}
</style>
</head>
<body>
<p id="msg">Opening the X app…</p>
<a id="fallback" class="btn" style="display:none" href="#">Open X in the browser</a>
<script>
  // Rimbalzo: prova l'APP X (schema twitter://, che l'app registra ancora),
  // poi ripiega sul compose web solo se l'app non ha risposto (pagina ancora visibile).
  var text = new URLSearchParams(location.search).get("text") || "";
  var app = "twitter://post?message=" + encodeURIComponent(text);
  var web = "https://x.com/intent/post?text=" + encodeURIComponent(text);
  var fb = document.getElementById("fallback");
  fb.href = web;
  location.href = app;
  setTimeout(function () {
    if (!document.hidden) {           // se l'app si è aperta, la pagina è nascosta: non fare nulla
      document.getElementById("msg").textContent = "X app not found — use the button:";
      fb.style.display = "inline-block";
    }
  }, 1600);
</script>
</body>
</html>
